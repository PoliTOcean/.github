name: KiBot PCB (shared)

on:
  workflow_call:

jobs:
  kibot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find KiCad project
        id: prj
        run: |
          PRO=$(ls hardware/*.kicad_pro 2>/dev/null | head -n1 || true)
          if [ -z "$PRO" ]; then
            echo "::notice::Nessun progetto KiCad in hardware/: niente da generare."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${PRO%.kicad_pro}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "board=$BASE.kicad_pcb" >> "$GITHUB_OUTPUT"
          echo "schema=$BASE.kicad_sch" >> "$GITHUB_OUTPUT"
          # KiCad 10 a volte scrive un UUID tutto a zero per il foglio principale: KiBot non lo accetta
          ROOT=$(grep -m1 -o '(uuid "[^"]*"' "$BASE.kicad_sch" | cut -d'"' -f2 || true)
          if [ -n "$ROOT" ]; then
            sed -i "/top_level_sheets/,/]/ s/00000000-0000-0000-0000-000000000000/$ROOT/" "$PRO"
          fi

      - uses: INTI-CMNB/KiBot@v2_k10
        if: steps.prj.outputs.found == 'true'
        with:
          config: hardware/config.kibot.yaml
          dir: .
          board: ${{ steps.prj.outputs.board }}
          schema: ${{ steps.prj.outputs.schema }}

      - uses: actions/upload-artifact@v4
        if: steps.prj.outputs.found == 'true'
        with:
          name: pcb-outputs
          path: outputs/

      - name: Commit renders
        if: steps.prj.outputs.found == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update PCB renders [skip ci]"
          git reset --hard
          git pull --rebase
          git push
